plugins {
    id 'java'
    id 'application'
}

group = 'com.sandbox'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // jMonkeyEngine 3.6.1-stable
    implementation 'org.jmonkeyengine:jme3-core:3.6.1-stable'
    implementation 'org.jmonkeyengine:jme3-desktop:3.6.1-stable'
    implementation 'org.jmonkeyengine:jme3-lwjgl3:3.6.1-stable'
    
    // For noise generation
    implementation 'com.sudoplay.joise:joise:1.1.0'
    
    // JSON for save/load
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.5.0'
}

application {
    mainClass = 'com.sandbox.voxel.Main'
}

test {
    useJUnit()
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': 'com.sandbox.voxel.Main'
        )
    }
}
